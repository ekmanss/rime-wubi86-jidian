#-----------------#
#    颜色使用说明   #
#-----------------#
# 我们平常一般用到的颜色都是 `RGB` 顺序的，如 `D1635D` 就是 `red: D1 | green: 63 | blue: 5D`
# 而这里面用到的颜色可以有两种表达方式：
# 一种是带透明度的 `ABGR` ，`A` 代码透明度，范围也是从 `00 - FF`，`00` 是透明 `FF` 是不透明；另一种是 `BGR`。
# 那么上面这个颜色在这里面就可以写成 `0x5D63D1` `0xFF5D63D1`

#-----------------#
#     字体说明     #
#-----------------#
# 只要是你本地有的字体就可以，可以打开 FontBook.app 查看
# 一般字体不需要指定，指定后的字体可能会出现候选框被拉伸成过高的情况，因为不同字体的纵向高度不同，默认字体适配最好

patch:
  style:
    color_scheme: roseo_maple            # 白亮模式下启用的皮肤，名字对应下方皮肤定义名
    color_scheme_dark: roseo_maple_dark  # 暗黑模式下启用的皮肤

    # 通用外观与布局（放在 style 下统一生效，避免两套配色重复定义）
    candidate_format: "[label]. [candidate] [comment]"   # 候选词格式，label: 序号，candidate: 候选词，comment: 词条注释
    candidate_list_layout: linear                        # stacked | linear
    text_orientation: horizontal                         # horizontal | vertical
    status_message_type: mix                             # long | short | mix
    memorize_size: true                                  # 控制候选框在接触屏幕边缘时是否有粘性

    alpha: 1.0                                           # 候选窗口透明度（浮点型，0 时隐藏候选框）
    corner_radius: 5                                     # 候选框圆角大小
    hilited_corner_radius: 5                             # 高亮候选词圆角大小
    line_spacing: 5                                      # stacked 布局时上下候选的间隔大小
    base_offset: 0                                       # 文字基线调整

    inline_preedit: true                                 # 输入编码直接嵌入输入框，false 时显示在候选框中
    spacing: 5                                           # inline_preedit 为 false 时编码与候选词之间的距离

    # 字体配置（Squirrel 使用 font_face / font_point 控制候选词字体）
    font_face: PingFang SC
    font_point: 18
    label_font_face: PingFang SC
    label_font_point: 17
    comment_font_face: PingFang SC
    comment_font_point: 16

  preset_color_schemes:
    roseo_maple:
      name: 玫枫 / Roseo Maple
      border_height: 0                          # 边框宽度 - 上下
      border_width: 0                           # 边框宽度 - 左右（两者同时大于 0 才显示边框）
      back_color: 0xF4F4F6                      # 背景颜色 - 面板
      preedit_back_color: 0x364572

      hilited_candidate_text_color: 0x4F11FA    # 字体颜色 - 高亮候选词
      hilited_candidate_back_color: 0xEDEDF9    # 背景颜色 - 高亮候选词（前两位为透明度）
      hilited_candidate_label_color: 0x884F11FA # 序号颜色 - 高亮候选词

      label_color: 0xaaaaaa                     # 序号颜色
      candidate_text_color: 0x222222            # 字体颜色 - 候选词
      comment_text_color: 0x5AC461              # 字体颜色 - 注释

      # inline_preedit 为 false 时
      hilited_text_color: 0x8E8E93              # 颜色 - 输入中 - 编码
      hilited_back_color: 0xEFEFF4              # 颜色 - 输入中 - 背景

    roseo_maple_dark:
      name: 玫枫-暗黑 / Roseo Maple Dark
      border_height: 1                          # 边框宽度 - 上下
      border_width: 1                           # 边框宽度 - 左右
      border_color: 0x444444                    # 边框颜色
      back_color: 0x333333                      # 背景颜色 - 面板
      preedit_back_color: 0x364572

      hilited_candidate_text_color: 0xffffff    # 字体颜色 - 高亮候选词
      hilited_candidate_back_color: 0x50ffffff  # 背景颜色 - 高亮候选词（半透明白色）
      hilited_candidate_label_color: 0x5AC461   # 序号颜色 - 高亮候选词

      label_color: 0x77ffffff                   # 序号颜色
      candidate_text_color: 0x99ffffff          # 字体颜色 - 候选词
      comment_text_color: 0x5AC461              # 字体颜色 - 注释

      # inline_preedit 为 false 时
      hilited_text_color: 0xaaaaaa              # 颜色 - 输入中 - 编码
      hilited_back_color: 0x555555              # 颜色 - 输入中 - 背景（深灰，适配暗黑模式）

  # --- 特定程序定义初始状态的英文输入 ---
  app_options:
    com.apple.Terminal:               # macOS 系统终端
      ascii_mode: true
    com.googlecode.iterm2:            # iTerm2
      ascii_mode: true
    com.termius-dmg.mac:              # Termius
      ascii_mode: true
    dev.warp.Warp-Stable:             # Warp
      ascii_mode: true
    dev.zed.Zed:                      # Zed
      ascii_mode: true
    com.microsoft.VSCode:             # VS Code
      ascii_mode: true
    com.todesktop.230313mzl4w4u92:    # Cursor
      ascii_mode: true
    com.jetbrains.pycharm:            # PyCharm Professional
      ascii_mode: true
    com.jetbrains.pycharm.ce:         # PyCharm Community
      ascii_mode: true
